[package]
name = "draf"
version = "0.1.0"
edition = "2021"
authors = ["Luiz Fonseca <toaster.chicory-0b@icloud.com>"]
description = "A strongly typed TypeScript compiler with LLVM backend"
license = "MIT"
repository = "https://github.com/yourusername/draf"

[dependencies]
inkwell = { version = "0.6.0", features = ["llvm18-1"] }
clap = { version = "4.4", features = ["derive"] }
logos = "0.15.0"
thiserror = "1.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
env_logger = "0.11.8"
lazy_static = "1.5.0"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"

[[bin]]
name = "draf"
path = "src/main.rs"

[lib]
name = "draf"
path = "src/lib.rs"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
